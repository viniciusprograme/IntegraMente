version: "3.9"

services:
  # Backend - API Node.js/Express
  backend:
    container_name: integramente-backend
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - FRONTEND_URL=http://localhost
    volumes:
      # Persistir banco de dados SQLite
      - ./backend/data:/app/data
      # Persistir logs (opcional)
      - ./logs/backend:/app/logs
    networks:
      - integramente-net
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:5000/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    labels:
      - "com.example.description=IntegraMente Backend API"

  # Frontend - Servidor HTTP Estático
  frontend:
    container_name: integramente-frontend
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    networks:
      - integramente-net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    labels:
      - "com.example.description=IntegraMente Frontend"

  # Nginx - Proxy Reverso (opcional mas recomendado)
  nginx:
    image: nginx:latest
    container_name: integramente-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      # Certificados SSL (quando usar HTTPS)
      # - /etc/letsencrypt:/etc/letsencrypt:ro
      # - /var/www/certbot:/var/www/certbot:ro
    networks:
      - integramente-net
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    labels:
      - "com.example.description=IntegraMente Nginx Proxy"

  # Adminer - Gerenciador de Banco de Dados (opcional, apenas desenvolvimento)
  adminer:
    image: adminer:latest
    container_name: integramente-adminer
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=backend
    networks:
      - integramente-net
    profiles:
      - dev # Usar: docker compose --profile dev up
    restart: unless-stopped
    labels:
      - "com.example.description=IntegraMente Adminer (Desenvolvimento)"

  # PostgreSQL (opcional, alternativa ao SQLite)
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: integramente-postgres
  #   environment:
  #     - POSTGRES_DB=integramente
  #     - POSTGRES_USER=admin
  #     - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - integramente-net
  #   restart: unless-stopped

networks:
  integramente-net:
    driver: bridge
    name: integramente-network

volumes:
  # postgres_data:
  #   driver: local

# Usar:
# docker compose up -d              # Iniciar em background
# docker compose up                 # Iniciar com logs
# docker compose down               # Parar tudo
# docker compose logs -f backend    # Ver logs backend
# docker compose logs -f frontend   # Ver logs frontend
# docker compose --profile dev up   # Iniciar com Adminer
